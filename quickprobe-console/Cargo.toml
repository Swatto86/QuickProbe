[package]
name = "quickprobe-console"
version = "0.1.0"
edition = "2021"
authors = ["Swatto"]
description = "Standalone table-first QuickProbe operations console"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = "0.29"
rusqlite = { version = "0.31", default-features = false, features = ["bundled"] }
serde_json = "1.0"
